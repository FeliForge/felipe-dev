<main class="wrap discover-section"><div class="section-head"><span class="path">~/felipe/</span><h1>FREE BROWSER GAMES<span class="ext">.html</span></h1></div><p class="discover-subtitle">Play free games directly in your browser. No download required.</p><div class="discover-toolbar"><div class="game-search-wrap"><span>⌕</span><input id="gameSearch" type="search" placeholder="Search games..." autocomplete="off"></div><div class="discover-filters" id="discoverFilters"></div></div><div class="game-grid" id="discoverGames"></div></main><footer>made by Felipe · ad-free, on purpose</footer><script src="games-config.js"></script><script>const C={es:{no:"Nenhum jogo encontrado"},pt:{no:"Nenhum jogo encontrado"},en:{no:"No games found"}};let lang=localStorage.getItem('felipe-lang')||'en',filter='all',q='';const cats=['all','action','fighting','racing','strategy','adventure','arcade','sports','casual','other'];const known=['action','fighting','racing','strategy','adventure','arcade','sports','casual','defense','story'];const match=(g,c)=>c==='all'||(c==='other'?![...[g.genre],...g.tags].some(x=>known.includes(String(x||'').toLowerCase())):[g.genre,...g.tags].some(x=>String(x||'').toLowerCase()===c));const card=g=>`<article class="game-card"><a href="${g.url}" target="_blank" rel="noopener"><div class="game-image-container"><img class="game-image" src="${g.image}" alt="Preview of ${g.name[lang]||g.name.en}" loading="lazy">${g.updated?'<span class="game-updated-badge">UPDATED</span>':''}</div></a><div class="game-info"><h2 class="game-name">${g.name[lang]||g.name.en}</h2><p class="game-genre">${g.genre}</p><p class="game-description">${g.description[lang]||g.description.en}</p><div class="game-tags">${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><a class="btn game-play-btn" href="${g.url}" target="_blank" rel="noopener">PLAY</a></div></article>`;function render(){document.getElementById('discoverFilters').innerHTML=cats.map(c=>`<button class="chip ${filter===c?'active':''}" data-c="${c}">${c.toUpperCase()}</button>`).join('');const list=GAMES.filter(g=>match(g,filter)&&(!q||[g.name[lang],g.description[lang],g.genre,g.keywords,...g.tags].join(' ').toLowerCase().includes(q.toLowerCase())));document.getElementById('discoverGames').innerHTML=list.length?list.map(card).join(''):'<div class="no-results">'+C[lang].no+'</div>';}document.getElementById('discoverFilters').onclick=e=>{const b=e.target.closest('[data-c]');if(b){filter=b.dataset.c;render()}};document.getElementById('gameSearch').oninput=e=>{q=e.target.value;render()};render();</script></body></html>
